<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Timetable Card Body -->
  <rect x="10" y="10" width="44" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#glow)" />

  <!-- Header Bar -->
  <path d="M10 18 C10 13.58 13.58 10 18 10 H46 C50.42 10 54 13.58 54 18 V22 H10 V18 Z" fill="url(#headerGrad)" />
  
  <!-- Calendar Rings / Binders -->
  <rect x="20" y="6" width="3" height="7" rx="1.5" fill="#94a3b8" />
  <rect x="41" y="6" width="3" height="7" rx="1.5" fill="#94a3b8" />

  <!-- Grid Slot Boxes -->
  <!-- Row 1 -->
  <rect x="14" y="26" width="10" height="7" rx="2" fill="url(#accentGrad)" opacity="0.9" />
  <rect x="27" y="26" width="10" height="7" rx="2" fill="#334155" />
  <rect x="40" y="26" width="10" height="7" rx="2" fill="url(#accentGrad)" opacity="0.7" />

  <!-- Row 2 -->
  <rect x="14" y="36" width="10" height="7" rx="2" fill="#334155" />
  <rect x="27" y="36" width="10" height="7" rx="2" fill="url(#accentGrad)" opacity="0.8" />
  <rect x="40" y="36" width="10" height="7" rx="2" fill="#334155" />

  <!-- Row 3 -->
  <rect x="14" y="46" width="10" height="5" rx="1.5" fill="url(#accentGrad)" opacity="0.6" />
  <rect x="27" y="46" width="10" height="5" rx="1.5" fill="#334155" />

  <!-- Clock / Automation Badge Overlay -->
  <circle cx="45" cy="45" r="11" fill="url(#clockGrad)" stroke="#0f172a" stroke-width="2" filter="url(#glow)" />
  
  <!-- Clock Hands -->
  <path d="M45 39 V45 H49" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkle Accent -->
  <path d="M37 16 L38.5 19.5 L42 21 L38.5 22.5 L37 26 L35.5 22.5 L32 21 L35.5 19.5 Z" fill="#f59e0b" />
</svg>